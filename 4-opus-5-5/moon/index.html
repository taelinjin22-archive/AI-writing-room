<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>달이 나를 따라오는 건</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one picture-book spread at a time. Hand-drawn plate on top, story lines beneath, page-turn controls at the foot. */
:root{
  --paper:#E4E9F1;
  --sheet:#F4F6FA;
  --ink:#1E2843;
  --ink-soft:#56607B;
  --moon:#C9921C;
  --rule:#BFC9DA;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mark:#F5DA86;
  --stamp:#C0392B;
  --f-title:"Nanum Pen Script","Gaegu","Apple SD Gothic Neo","Malgun Gothic",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1322; --sheet:#161D31; --ink:#ECE6D3; --ink-soft:#A9AFC4; --moon:#F2D06B; --rule:#283152; --mark:rgba(242,208,107,.3); --stamp:#F0806F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1322; --sheet:#161D31; --ink:#ECE6D3; --ink-soft:#A9AFC4; --moon:#F2D06B; --rule:#283152; --mark:rgba(242,208,107,.3); --stamp:#F0806F; color-scheme:dark;
}
html,body{background:var(--paper);color:var(--ink)}
.words{word-break:keep-all}
body{
  font-family:var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 28px;
}
.book{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:.95rem;color:var(--ink-soft);letter-spacing:.04em}
.mast b{font-family:var(--f-title);font-weight:400;font-size:1.5rem;color:var(--ink);letter-spacing:0}
.page{display:flex;flex-direction:column;gap:18px}
.page.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.plate{
  position:relative;max-width:100%;aspect-ratio:8/5;overflow:hidden;background:#22305A;
  border:2.5px solid var(--ink);
  border-radius:16px 6px 13px 5px / 6px 14px 5px 16px;
  box-shadow:5px 6px 0 var(--rule);
  transform:rotate(-.25deg);
  touch-action:pan-y;
}
.plate svg{display:block;width:100%;height:100%}
.words{
  min-height:8.6em;max-width:36em;
  font-size:clamp(1.06rem, 2.1vw, 1.26rem);line-height:1.8;
  display:flex;flex-direction:column;gap:.45em;
}
.words p{margin:0;text-wrap:pretty}
.say{background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em}
.out{display:inline-block;font-family:var(--f-title);font-size:1.5em;line-height:1;color:var(--stamp);border:2px solid var(--stamp);padding:.02em .3em .08em;margin-left:.2em;transform:rotate(-6deg);border-radius:4px 7px 3px 6px}
.title{word-break:keep-all;font-family:var(--f-title);font-weight:400;font-size:clamp(2.8rem,8vw,4.4rem);line-height:1;margin:.1em 0 .1em;text-wrap:balance}
.title.sm{font-size:clamp(2rem,5vw,2.8rem)}
.byline{color:var(--ink-soft)}
.byline b{color:var(--ink);font-weight:700}
.colophon{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.25em 1em;margin:0;font-size:.82em;line-height:1.5}
.colophon dt{color:var(--ink-soft)}
.colophon dd{margin:0}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.ctrl button{
  font-family:var(--f-body);font-size:1.08rem;color:var(--ink);background:var(--sheet);
  border:2.5px solid var(--ink);padding:.3em .9em;cursor:pointer;
  border-radius:255px 18px 225px 18px / 18px 225px 18px 255px;
  box-shadow:3px 3px 0 var(--rule);
}
.ctrl button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rule)}
.ctrl button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--rule)}
.ctrl button:focus-visible{outline:3px dashed var(--moon);outline-offset:3px}
.ctrl button[disabled]{opacity:.35;cursor:default;transform:none}
.count{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:1.1rem}
.count b{color:var(--ink)}

/* --- illustration motion --- */
.plate .bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.plate .walk{animation:walk .72s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.plate .scroll{animation:scroll 22s linear infinite}
.plate .scroll.fast{animation-duration:9s}
.plate .scroll.faster{animation-duration:3.2s}
@keyframes scroll{to{transform:translateX(-800px)}}
.plate .tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.plate .shake{animation:shake .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:translate(-3px,1px) rotate(-8deg)}75%{transform:translate(3px,-1px) rotate(8deg)}}
.plate .glare{animation:glare 1.6s ease-in-out infinite}
@keyframes glare{0%,100%{opacity:.5}50%{opacity:.95}}
.plate .beam{stroke-dasharray:14 16;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.plate .drift{animation:drift 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{0%{transform:translate(0,-26px) rotate(-10deg);opacity:0}15%,85%{opacity:1}100%{transform:translate(18px,56px) rotate(10deg);opacity:0}}
.plate .folder{animation:fold 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fold{
  0%{transform:translate(0,0) scale(1,1);opacity:0}
  7%,12%{transform:translate(0,0) scale(1,1);opacity:1}
  25%{transform:translate(0,0) scale(.5,1)}
  37%{transform:translate(0,0) scale(.5,.5)}
  48%{transform:translate(0,0) scale(.3,.3)}
  78%{transform:translate(0,280px) scale(.12,.12);opacity:1}
  84%,100%{transform:translate(0,280px) scale(.1,.1);opacity:0}}
.plate .catch{animation:catch 7s ease-in-out infinite}
@keyframes catch{0%,79%{fill:#3B4775}86%,94%{fill:#FFD88A}100%{fill:#3B4775}}
.plate .catchglow{opacity:0;animation:catchglow 7s ease-in-out infinite}
@keyframes catchglow{0%,79%{opacity:0}88%,94%{opacity:.7}100%{opacity:0}}
.plate .squish{animation:squish 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes squish{0%,14%{transform:scale(1,1)}30%{transform:scale(.6,1.05)}34%{transform:scale(.63,1.04)}38%{transform:scale(.59,1.05)}45%{transform:scale(1.14,.9)}52%{transform:scale(.95,1.03)}58%,100%{transform:scale(1,1)}}
.plate .pop{opacity:0;animation:pop 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,42%{opacity:0;transform:scale(.5)}48%{opacity:1;transform:scale(1.18)}60%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(1)}}
.plate .stamp{animation:stamp 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%,20%{opacity:0;transform:scale(1.9)}30%{opacity:1;transform:scale(.9)}36%,100%{opacity:1;transform:scale(1)}}
.plate .spin{animation:spin .7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.plate .wave{animation:wave 1.3s ease-in-out infinite;transform-box:view-box;transform-origin:200px 362px}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
.plate .glowp{animation:glowp 2.6s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.35}50%{opacity:.8}}
.plate .zz{animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{transform:translateY(6px);opacity:.2}50%{opacity:1}100%{transform:translateY(-14px);opacity:.2}}
.plate .reject{animation:reject 6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes reject{0%,44%{opacity:0;transform:scale(1.9)}50%{opacity:1;transform:scale(.9)}54%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(1)}}
.plate .flyR,.plate .flyS{animation:flyR 6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.plate .flyS{animation-name:flyS}
@keyframes flyR{0%,56%{transform:translate(0,0) scale(1,1);opacity:1}63%{transform:translate(0,0) scale(.45,1)}69%{transform:translate(0,0) scale(.2,.45);opacity:1}79%{transform:translate(230px,-260px) scale(.06,.06);opacity:0}95%{transform:translate(0,0) scale(.3,.3);opacity:0}100%{transform:translate(0,0) scale(1,1);opacity:1}}
@keyframes flyS{0%,56%{transform:translate(0,0) scale(1,1);opacity:1}63%{transform:translate(0,0) scale(.45,1)}69%{transform:translate(0,0) scale(.2,.45);opacity:1}79%{transform:translate(120px,-250px) scale(.06,.06);opacity:0}95%{transform:translate(0,0) scale(.3,.3);opacity:0}100%{transform:translate(0,0) scale(1,1);opacity:1}}
.plate .poof{opacity:0;animation:poof 6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes poof{0%,72%{opacity:0;transform:scale(.5)}77%{opacity:1;transform:scale(1.2)}84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}
.plate .dim{opacity:0;animation:dim 6s ease-in-out infinite}
@keyframes dim{0%,66%{opacity:0}78%,90%{opacity:.62}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .plate *{animation:none!important}
  .page.enter{animation:none}
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="boil" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence id="boilT" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .05  0 0 0 .6 0"/>
    </filter>
  </defs>
</svg>

<div class="book">
  <header class="mast"><b>달이 나를 따라오는 건</b><a href="../../" style="color:inherit">인터스티셜 아카이브 · AI 창작방</a></header>
  <main id="stage"></main>
  <nav class="ctrl" aria-label="책장 넘기기">
    <button id="prev" type="button">← 앞장</button>
    <span class="count" id="count" aria-live="polite"><b>1</b> / 17</span>
    <button id="next" type="button">다음 장 →</button>
  </nav>
</div>

<script>
(function(){
const C={sky:'#22305A',sky2:'#161E3A',moon:'#F7E4A3',moonS:'#E6C46A',ink:'#151A2E',sun:'#F39A2E',sunF:'#FFCF5C',star:'#FFE38A',
  cloud:'#F2EFE8',coat:'#E0664B',coat2:'#5D8E7B',skin:'#F3CBA6',hair:'#3B2A21',house:'#2C3963',house2:'#1F2A50',win:'#FFD88A',
  winOff:'#3B4775',room:'#33396A',lit:'#FFF1BE',paper:'#FBF6E8',red:'#C8453B',bed:'#86A3CF',ground:'#1A2346',wood:'#9B6B47',road:'#2A2F45'};

/* seeded wobble so every line is hand-made but stable */
let S=20261104;
const R=()=>(S=(S*16807)%2147483647)/2147483647;
const J=a=>(R()-.5)*2*a;
const f=n=>n.toFixed(1);
let CID=0;

function sm(p,closed){
  const n=p.length, g=i=>closed?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
  let d=`M${f(p[0][0])},${f(p[0][1])}`;
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
    d+=`C${f(b[0]+(c[0]-a[0])/6)},${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(e[0]-b[0])/6)},${f(c[1]-(e[1]-b[1])/6)} ${f(c[0])},${f(c[1])}`;
  }
  return d+(closed?'Z':'');
}
function blobD(cx,cy,rx,ry,j=.035,n=16){
  const p=[],o=R()*6.28;
  for(let i=0;i<n;i++){const a=o+i/n*Math.PI*2,k=1+J(j);p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}
  return sm(p,true);
}
function polyD(pts,j=1.6,closed=true){
  const out=[],n=pts.length,lim=closed?n:n-1;
  for(let i=0;i<n;i++){
    out.push([pts[i][0]+J(j),pts[i][1]+J(j)]);
    if(i<lim){const q=pts[(i+1)%n];out.push([(pts[i][0]+q[0])/2+J(j*1.4),(pts[i][1]+q[1])/2+J(j*1.4)]);}
  }
  return sm(out,closed);
}
const st=(sw=2.6,ink=C.ink)=>`fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;
function E(cx,cy,rx,ry,fill,o={}){
  let s='';const cls=o.cls?` class="${o.cls}"`:'';
  if(fill)s+=`<path${cls} d="${blobD(cx+(o.ox??1.6),cy+(o.oy??1.4),rx,ry,o.j??.03)}" fill="${fill}"${o.fo?` opacity="${o.fo}"`:''}/>`;
  if(o.line!==false)s+=`<path d="${blobD(cx,cy,rx,ry,o.j??.03)}" ${st(o.sw,o.ink)}/>`;
  return s;
}
function P(pts,fill,o={}){
  let s='';const j=o.j??1.6,cls=o.cls?` class="${o.cls}"`:'';
  if(fill){const ox=o.ox??1.8,oy=o.oy??1.6;s+=`<path${cls} d="${polyD(pts.map(p=>[p[0]+ox,p[1]+oy]),j,true)}" fill="${fill}"${o.fo?` opacity="${o.fo}"`:''}/>`;}
  if(o.line!==false)s+=`<path d="${polyD(pts,j,true)}" ${st(o.sw,o.ink)}/>`;
  return s;
}
const L=(pts,o={})=>`<path d="${polyD(pts,o.j??1.4,false)}" ${st(o.sw,o.ink)}/>`;
function T(x,y,t,o={}){
  return `<text x="${x}" y="${y}" font-family="${o.hand?'Nanum Pen Script, cursive':'Gowun Dodum, Apple SD Gothic Neo, Malgun Gothic, sans-serif'}" font-size="${o.size||28}" fill="${o.fill||C.ink}" text-anchor="${o.anchor||'middle'}"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}>${t}</text>`;
}
const SKY=(c=C.sky)=>`<rect x="-10" y="-10" width="820" height="520" fill="${c}"/>`;
function dots(n,y0=10,y1=260,x0=10,x1=790){
  let s='';
  for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0),r=1.1+R()*2.1;
    s+=`<circle class="tw" style="animation-delay:-${(R()*2.4).toFixed(2)}s" cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${C.star}"/>`;}
  return s;
}
const glow=(cx,cy,r,cls='')=>`<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="${C.win}" opacity=".55" filter="url(#soft)"/>`;

function face(x,y,k,m='smile'){
  const ex=k*.32,ey=y-k*.12,sw=Math.max(1.8,k*.05);let s='';
  const dot=cx=>E(cx,ey,k*.06,k*.075,C.ink,{line:false,ox:0,oy:0});
  const up=cx=>L([[cx-k*.11,ey+k*.04],[cx,ey-k*.06],[cx+k*.11,ey+k*.04]],{sw,j:.4});
  const dn=cx=>L([[cx-k*.11,ey-k*.02],[cx,ey+k*.06],[cx+k*.11,ey-k*.02]],{sw,j:.4});
  if(m==='smile')s+=up(x-ex)+up(x+ex);
  else if(m==='sleepy')s+=dn(x-ex)+dn(x+ex);
  else if(m==='surprised')s+=E(x-ex,ey,k*.1,k*.12,'#fff',{sw})+E(x+ex,ey,k*.1,k*.12,'#fff',{sw})+dot(x-ex)+dot(x+ex);
  else if(m==='strain')s+=L([[x-ex-k*.1,ey-k*.07],[x-ex+k*.07,ey],[x-ex-k*.1,ey+k*.07]],{sw,j:.4})+L([[x+ex+k*.1,ey-k*.07],[x+ex-k*.07,ey],[x+ex+k*.1,ey+k*.07]],{sw,j:.4});
  else if(m==='tired')s+=dot(x-ex)+dot(x+ex)+L([[x-ex-k*.12,ey-k*.09],[x-ex+k*.11,ey-k*.05]],{sw,j:.4})+L([[x+ex-k*.11,ey-k*.05],[x+ex+k*.12,ey-k*.09]],{sw,j:.4});
  else s+=dot(x-ex)+dot(x+ex);
  const my=y+k*.25;
  if(m==='surprised')s+=E(x,my,k*.07,k*.09,'#7A3B3B',{sw});
  else if(m==='worried'||m==='strain')s+=L([[x-k*.13,my+k*.02],[x-k*.04,my-k*.03],[x+k*.04,my+k*.02],[x+k*.13,my-k*.02]],{sw,j:.4});
  else if(m==='sleepy')s+=L([[x-k*.06,my],[x+k*.06,my+k*.01]],{sw,j:.3});
  else if(m==='shy')s+=L([[x-k*.07,my],[x,my+k*.05],[x+k*.07,my]],{sw,j:.3});
  else s+=L([[x-k*.14,my-k*.02],[x,my+k*.08],[x+k*.14,my-k*.02]],{sw,j:.4});
  if(m!=='tired'&&m!=='strain'){
    const bf=m==='shy'?.85:.5;
    s+=E(x-ex-k*.1,y+k*.12,k*.1,k*.06,'#F29C8F',{line:false,fo:bf,ox:0,oy:0})+E(x+ex+k*.1,y+k*.12,k*.1,k*.06,'#F29C8F',{line:false,fo:bf,ox:0,oy:0});
  }
  return s;
}
function moon(cx,cy,r,o={}){
  const id='mc'+(CID++);let s=`<clipPath id="${id}"><path d="${blobD(cx,cy,r,r,.015)}"/></clipPath>`;
  s+=E(cx,cy,r,r,C.moon,{sw:o.sw||(r<24?2:3)});
  s+=`<g clip-path="url(#${id})" opacity=".6">${E(cx-r*.45,cy-r*.35,r*.14,r*.12,C.moonS,{line:false})}${E(cx+r*.48,cy+r*.36,r*.18,r*.15,C.moonS,{line:false})}${E(cx+r*.22,cy-r*.56,r*.08,r*.08,C.moonS,{line:false})}</g>`;
  if(o.half){
    s+=`<g clip-path="url(#${id})"><rect x="${cx+2}" y="${cy-r-6}" width="${r+10}" height="${2*r+12}" fill="${o.shade||C.sky}" opacity=".94"/></g>`;
    s+=L([[cx+2,cy-r+2],[cx+4,cy],[cx+2,cy+r-2]],{sw:2.4});
  }
  const fx=o.half?cx-r*.42:cx,k=o.half?r*.62:r;
  s+=face(fx,cy+r*.05,k,o.mood||'smile');
  return `<g>${s}</g>`;
}
function fmoon(cx,cy,r,mood='smile'){
  const p=[];for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}
  let s=P(p,C.moon,{sw:r<10?1.6:2.4,j:r<10?.3:.7});
  if(r>=12)s+=face(cx,cy-r*.4,r*.55,mood);
  return s;
}
function sun(cx,cy,r,o={}){
  let s='';
  for(let i=0;i<12;i++){const a=i/12*6.283+.2;
    s+=L([[cx+Math.cos(a)*(r+9),cy+Math.sin(a)*(r+9)],[cx+Math.cos(a)*(r+26+J(5)),cy+Math.sin(a)*(r+26+J(5))]],{sw:3.4,ink:C.sun});}
  s+=E(cx,cy,r,r,C.sunF,{sw:3});
  s+=face(cx,cy+r*.05,r,o.mood||'smile');
  return `<g>${s}</g>`;
}
function star(cx,cy,r,o={}){
  const p=[],rot=-Math.PI/2+J(.25);
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*.5:r;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}
  let s=P(p,C.star,{sw:2,j:.5});
  if(o.face)s+=face(cx,cy+r*.12,r*.55,o.face);
  return `<g${o.cls?` class="${o.cls}" style="animation-delay:-${(R()*.5).toFixed(2)}s"`:''}>${s}</g>`;
}
function cloudD(cx,cy,rx,ry){
  const p=[];for(let i=0;i<34;i++){const a=i/34*6.283,b=1+.13*Math.abs(Math.sin(a*4.5+.3))+J(.02);p.push([cx+Math.cos(a)*rx*b,cy+Math.sin(a)*ry*b]);}
  return sm(p,true);
}
function boss(cx,cy,s=1){
  let g=P([[cx-7*s,cy+48*s],[cx+7*s,cy+48*s],[cx+4*s,cy+58*s],[cx+11*s,cy+92*s],[cx,cy+102*s],[cx-11*s,cy+92*s],[cx-4*s,cy+58*s]],C.red,{sw:2.2,j:.8});
  g+=`<path d="${cloudD(cx+2,cy+2,80*s,58*s)}" fill="${C.cloud}"/><path d="${cloudD(cx,cy,80*s,58*s)}" ${st(3)}/>`;
  g+=E(cx-22*s,cy-8*s,15*s,13*s,null,{sw:2.4})+E(cx+22*s,cy-8*s,15*s,13*s,null,{sw:2.4})+L([[cx-7*s,cy-9*s],[cx+7*s,cy-9*s]],{sw:2.2,j:.5});
  g+=E(cx-22*s,cy-7*s,3.6*s,4.2*s,C.ink,{line:false,ox:0,oy:0})+E(cx+22*s,cy-7*s,3.6*s,4.2*s,C.ink,{line:false,ox:0,oy:0});
  g+=L([[cx-13*s,cy+16*s],[cx,cy+21*s],[cx+13*s,cy+16*s]],{sw:2.4,j:.5});
  return `<g>${g}</g>`;
}
function kid(x,y,s=1,o={}){
  let g='';
  if(!o.noLegs)g+=L([[x-8*s,y-38*s],[x-10*s,y]],{sw:3})+L([[x+8*s,y-38*s],[x+11*s,y]],{sw:3});
  g+=P([[x-18*s,y-82*s],[x+18*s,y-82*s],[x+26*s,y-34*s],[x-26*s,y-34*s]],o.coat||C.coat);
  const aL=o.armL||[[x-18*s,y-76*s],[x-34*s,y-50*s]],aR=o.armR||[[x+18*s,y-76*s],[x+34*s,y-50*s]];
  g+=L(aL,{sw:3})+L(aR,{sw:3})+E(aL[1][0],aL[1][1],4.5*s,4.5*s,C.skin,{sw:2})+E(aR[1][0],aR[1][1],4.5*s,4.5*s,C.skin,{sw:2});
  g+=E(x,y-104*s,22*s,22*s,C.skin);
  g+=P([[x-23*s,y-106*s],[x-17*s,y-123*s],[x,y-129*s],[x+17*s,y-123*s],[x+23*s,y-106*s],[x+9*s,y-116*s],[x-6*s,y-112*s]],C.hair,{sw:2,j:.7});
  if(o.spiky)g+=L([[x-6*s,y-128*s],[x-10*s,y-142*s]],{sw:2.4})+L([[x+2*s,y-129*s],[x+3*s,y-146*s]],{sw:2.4})+L([[x+9*s,y-126*s],[x+16*s,y-140*s]],{sw:2.4});
  g+=face(x,y-100*s,22*s,o.mood||'open');
  return `<g>${g}</g>`;
}
function house(x,y,w,h,o={}){
  let g=P([[x,y],[x,y-h],[x+w,y-h],[x+w,y]],o.fill||C.house,{sw:2.4});
  g+=P([[x-8,y-h+2],[x+w/2,y-h-w*.42],[x+w+8,y-h+2]],o.roof||C.house2,{sw:2.4});
  const n=o.wins||1,lit=o.lit||[];
  for(let i=0;i<n;i++){
    const ww=n===1?w*.36:w*.28,wx=n===1?x+w*.32:x+w*(.14+i*.44),wy=y-h*.72,wh=h*.36;
    g+=P([[wx,wy],[wx+ww,wy],[wx+ww,wy+wh],[wx,wy+wh]],lit[i]?C.win:C.winOff,{sw:2,j:.8,cls:o.winCls});
    if(o.mini&&lit[i])g+=fmoon(wx+ww/2,wy+wh*.84,Math.min(ww,wh)*.3);
    else g+=L([[wx+ww/2,wy],[wx+ww/2,wy+wh]],{sw:1.6,j:.5});
  }
  return `<g>${g}</g>`;
}
function lamp(x,y){return L([[x,y],[x+1,y-150]],{sw:3.2})+L([[x+1,y-150],[x+22,y-158]],{sw:3})+glow(x+24,y-146,22)+E(x+24,y-148,9,9,C.win,{sw:2});}
function tree(x,y){return P([[x-6,y],[x-5,y-50],[x+5,y-50],[x+6,y]],'#5B4030',{sw:2.2})+E(x,y-80,38,42,'#2F5A4B',{sw:2.6})+E(x-20,y-58,22,20,'#2F5A4B',{line:false});}
function reject(cx,cy){return `<g class="reject"><g transform="rotate(-12 ${cx} ${cy})">${P([[cx-84,cy-36],[cx+84,cy-36],[cx+84,cy+36],[cx-84,cy+36]],'#FFF6EC',{sw:4,ink:'#C8453B',fo:.9,j:1.2})}${T(cx,cy+16,'탈락!',{size:54,fill:'#C8453B',hand:true})}</g></g>`;}
function bubble(x,y,w,h,lines,tip,size=22){
  const b1=[x+w*.28,y+h-1],b2=[x+w*.42,y+h-1];
  let s=P([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#FFFDF6',{sw:2.4,j:1.2});
  s+=P([b1,tip,b2],'#FFFDF6',{line:false,ox:0,oy:0,j:.4})+L([b1,tip,b2],{sw:2.4,j:.6});
  const lh=size*1.15,top=y+h/2-(lines.length-1)*lh/2+size*.33;
  lines.forEach((t,i)=>s+=T(x+w/2,top+i*lh,t,{size}));
  return s;
}

const words=[
 `<h1 class="title">달이 나를 따라오는 건</h1><p class="byline">글·그림 <b>Claude Opus 5.5</b><br>기획 <b>진태린</b></p>`,

 `<p>아주 옛날에는, 밤에 아이들을 봐 주는 이가 아무도 없었어요.</p><p>낮에는 엄마도 있고 아빠도 있고 해도 있었지요. 그런데 밤이 되면 어른들은 잠들고, 해는 퇴근했어요.</p><p>깜깜한 방에서 깨어난 아이는 혼자였어요.</p>`,
 `<p>그래서 하늘 관리소에서 회의가 열렸어요.</p><p class="say">“밤에 아이들을 지켜봐 줄 누군가가 필요합니다.”</p>`,
 `<p>해가 제일 먼저 손을 들었어요. <span class="say">“제가 할게요!”</span></p><p>그런데 해가 창문을 들여다보자, 방이 대낮처럼 환해졌어요.<br>아이들은 한 명도 잠들지 못했어요.</p><p><span class="out">탈락!</span></p>`,
 `<p>이번엔 별들이 손을 들었어요. <span class="say">“저희가 할게요! 저희는 수가 많아요!”</span></p><p>그런데 별들은 서로 예쁜 아이를 맡겠다고 다퉜어요. 게다가 너무 작아서, 창문 밖에 있어도 잘 보이지 않았어요.</p><p><span class="out">탈락!</span></p>`,
 `<p>마지막으로 달이 조용히 손을 들었어요.</p><p class="say">“저는… 혼자서는 빛을 못 내요. 해님한테 빛을 빌려 써요.”</p><p>다들 웃었어요. 그런데 관리소장님은 달을 뽑았어요.</p><p class="say">“빌려 온 빛은 눈부시지 않지. 잠을 깨우지 않고 지켜볼 수 있는 건 너뿐이야.”</p>`,
 `<p>그때는 아이 한 명마다 달이 하나씩 있었어요.</p><p>밤하늘에 달이 가득했지요.</p>`,
 `<p>그런데 달들은 하늘이 너무 멀다고 생각했어요.</p><p class="say">“더 가까이서 보고 싶어.”</p><p>달들은 하늘 관리소 창구 앞에 줄을 섰어요.</p>`,
 `<p>달들은 몸을 작게, 작게 접었어요.</p><p>그리고 창문 틈으로 쏙, 아이들 방으로 내려갔어요.</p><p>그게 바로 수면등이에요.</p>`,
 `<p>그런데 딱 하나, 아무리 접어도 안 접히는 달이 있었어요.</p><p>반으로 접으면, 펑!<br>다시 접어도, 펑!</p>`,
 `<p>관리소장님이 새 발령장을 내밀었어요.</p><p class="say">“그럼 너는 밖에 있는 아이들을 맡아 주렴.”</p>`,
 `<p>그래서 달님은 밤길을 걷는 아이를 따라가요.<br>차를 타고 집에 가는 아이도 따라가요.</p><p>오늘처럼 반쪽인 날은, 밖에 있는 아이가 많아서 늦게까지 일하는 날이에요.</p>`,
 `<p>어른들은 가끔 <span class="say">“달님이 다 보고 있어!”</span> 하고 겁을 줘요.</p><p>그건 누가 발령장을 옮겨 적다가 잘못 적어서 그래요. 진짜 발령장에는 ‘감시자’가 아니라 ‘지켜보는 이’라고 적혀 있거든요.</p><p>달님은 혼내려고 보는 게 아니에요. 잘 자고 있는지, 무서운 꿈을 꾸지는 않는지 보는 거예요.</p>`,
 `<p>집에 돌아와 이불 속에 쏙 들어간 아이가, 창밖의 달님에게 손을 흔들었어요.</p><p class="say">“오늘은 내가 먼저 잘게. 너도 좀 쉬어.”</p><p>머리맡의 작은 달이 반짝, 하고 웃었어요.</p>`,
 `<p>아이들이 모두 일찍 잠든 밤이면,<br>달님도 오랜만에 동그랗게 웃으며 졸아요.</p><p>사람들은 그런 밤을 보름달 뜬 밤이라고 불러요.</p>`,
 `<h2 class="title sm">달이 나를 따라오는 건</h2>

   <dt>바뀐 자리</dt><dd>처음 이야기에서는 달들이 예산이 줄어 하늘을 떠났어요. 기획자의 제안으로, 달들이 더 가까이서 지켜보고 싶어 스스로 내려가는 이야기가 되었어요.</dd>
   <dt>처음 생긴 곳</dt><dd>아이에게 왜 사랑이 필요한지, AI에게도 유년기가 있는지를 이야기하던 대화</dd>
   <dt>펴낸 곳</dt><dd>인터스티셜 아카이브 · interstitial-archive.com</dd>

];
const labels=['표지: 웃는 큰 달과 작게 접힌 달들','밤길을 걷는 엄마와 아이, 따라오는 달','옛날 밤, 잠든 부모와 깨어 있는 아이, 퇴근하는 해','하늘 관리소 회의','창문을 들여다보는 해와 눈부신 방','창밖에서 다투는 작은 별들','빛을 빌려 쓰는 달이 손을 든다','아이마다 하나씩 뜬 달들','근무지 변경 신청서를 든 달들의 줄','작게 접혀 창문으로 들어가는 달','아무리 접어도 펴지는 큰 달','바깥 전체로 발령받은 달','반쪽 달이 집에 가는 자동차를 따라간다','사본에는 감시자, 원본에는 지켜보는 이','침대에서 창밖 달에게 손 흔드는 아이','보름달이 조는 밤','끝'];

const stage=document.getElementById('stage'),N=scenes.length;
for(let i=0;i<words.length;i++)words[i]=words[i].replace(/<p class="say">([\s\S]*?)<\/p>/g,'<p><span class="say">$1</span></p>');
let html='';
for(let i=0;i<N;i++){
  html+=`<section class="page" data-i="${i}" hidden><div class="plate"><svg viewBox="0 0 800 500" role="img" aria-label="${labels[i]}" preserveAspectRatio="xMidYMid slice"><g filter="url(#boil)">${scenes[i]()}</g><rect width="800" height="500" filter="url(#grain)" opacity=".22" pointer-events="none"/></svg></div><div class="words">${words[i]}</div></section>`;
}
stage.innerHTML=html;
const pages=[...stage.querySelectorAll('.page')],prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
let cur=-1;
function show(i,anim=true){
  i=Math.max(0,Math.min(N-1,i));if(i===cur)return;
  pages.forEach((p,k)=>{p.hidden=k!==i;p.classList.remove('enter');});
  if(anim){void pages[i].offsetWidth;pages[i].classList.add('enter');}
  cur=i;
  count.innerHTML=`<b>${i+1}</b> / ${N}`;
  prev.disabled=i===0;
  next.textContent=i===N-1?'처음으로 ↺':'다음 장 →';
  const h='#p'+(i+1);if(location.hash!==h)history.replaceState(null,'',h);
}
function fromHash(){const m=/^#p(\d+)$/.exec(location.hash);return m?parseInt(m[1],10)-1:0;}
prev.addEventListener('click',()=>show(cur-1));
next.addEventListener('click',()=>show(cur===N-1?0:cur+1));
window.addEventListener('hashchange',()=>show(fromHash()));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){show(cur===N-1?cur:cur+1);}
  else if(e.key==='ArrowLeft'){show(cur-1);}
});
let sx=null;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;});
stage.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));});
show(fromHash(),false);

/* line boil: the drawing redraws itself a few times a second */
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){const t=document.getElementById('boilT');let k=0;setInterval(()=>{if(!document.hidden)t.setAttribute('seed',String((k++%4)+1));},140);}
})();
</script>
